# 9Router Nginx 参考配置（宝塔面板）
#
# 实际操作推荐走面板流程（见 DEPLOY-AUTO.md「域名 + HTTPS」一节）:
#   建站 → 申请 Let's Encrypt → 反向代理到 http://127.0.0.1:20128
# 然后在「网站 → 设置 → 配置文件」中，把宝塔生成的反代 location 块补上下面标注的参数。
#
# 本文件是完整参考 server 块，仅当你不用面板建站、完全手写 Nginx 配置时使用。
# 使用时把 your-domain.com 替换为你的域名，并把 map/limit 两行挪到 http 层（或确保不重复定义）。

# map $http_upgrade $connection_upgrade {
#     default upgrade;
#     ''      close;
# }
# limit_req_zone  $binary_remote_addr zone=9router_limit:10m rate=20r/s;
# limit_conn_zone $binary_remote_addr zone=9router_conn:10m;

server {
    listen 80;
    server_name your-domain.com;

    # 宝塔申请 Let's Encrypt 后，证书路径形如下面两行（以面板实际生成为准）
    listen 443 ssl http2;
    ssl_certificate     /www/server/panel/vhost/cert/your-domain.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/your-domain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /www/wwwlogs/your-domain.com.log;
    error_log  /www/wwwlogs/your-domain.com.error.log;

    # 支持较大的模型请求体
    client_max_body_size 50M;
    proxy_connect_timeout 60s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;

    location / {
        limit_req  zone=9router_limit burst=10 nodelay;
        limit_conn 9router_conn 10;

        proxy_pass http://127.0.0.1:20128;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 支持
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # 关键：SSE 流式响应必须关闭缓冲
        proxy_buffering off;
        proxy_cache off;
    }

    # 健康检查（可选）
    location = /health {
        access_log off;
        proxy_pass http://127.0.0.1:20128/api/health;
    }
}
