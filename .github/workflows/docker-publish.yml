name: Build and Deploy

on:
  push:
    branches: [master]
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: build-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  GHCR_IMAGE: ghcr.io/gillbardarrpodf4566-byte/9router

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GHCR_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.GHCR_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.GHCR_IMAGE }}:buildcache,mode=max
          platforms: linux/amd64
          provenance: false
          sbom: false

  # 可选：配置了 DEPLOY_HOST secret 时立即 SSH 部署（秒级）；
  # 未配置则跳过，服务器侧 cron 每 5 分钟自动检测新镜像并更新（见 deploy/bootstrap.sh）
  deploy:
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd ${{ secrets.DEPLOY_DIR }}
            # Re-sync deploy.sh from the repo before running it. The server's copy had
            # drifted to an older revision whose `docker login` was commented out, so it
            # ignored the GHCR_TOKEN injected below and relied on a stale credential cache
            # — which is why deploys failed intermittently with "error from registry: denied".
            # Keeping the server copy in sync also repairs the 5-minute cron fallback.
            curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/master/deploy/deploy.sh" -o deploy.sh \
              && chmod +x deploy.sh \
              || echo "::warning::deploy.sh sync failed; falling back to the existing server copy"
            # Inject GHCR token into .env
            grep -q '^GHCR_USER=' .env || echo 'GHCR_USER=gillbardarrpodf4566-byte' >> .env
            sed -i "s|^GHCR_USER=.*|GHCR_USER=gillbardarrpodf4566-byte|" .env
            sed -i "s|^GHCR_TOKEN=.*|GHCR_TOKEN=${{ secrets.GHCR_TOKEN }}|" .env
            # Explicitly login with the injected token BEFORE pulling the image.
            # Belt-and-braces: works even if the synced deploy.sh is ever changed again.
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u gillbardarrpodf4566-byte --password-stdin
            bash deploy.sh
